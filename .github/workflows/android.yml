name: APK Android

on:
  push:
    branches: ["claude/affectionate-faraday-f7voms", "main"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Keep the same debug signing key between builds, so a new APK installs
      # as an update instead of asking to uninstall the previous one.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vermut-debug-keystore-v1

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vermut-route-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vermut-route.apk
          gh release create "apk-${{ github.run_number }}" vermut-route.apk \
            --target "${{ github.sha }}" \
            --title "APK de prueba #${{ github.run_number }}" \
            --notes "Prototipo para probar en Android. Descarga vermut-route.apk desde el móvil e instálalo. Commit: ${{ github.sha }}"
